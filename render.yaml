# Render Blueprint: opretter Claim Pilot som en gratis web service.
# Render → New → Blueprint → vælg dette repo. Udfyld de hemmelige værdier, når Render spørger.
services:
  - type: web
    name: claim-pilot
    runtime: python
    plan: free
    rootDir: claim_pilot
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: OPERATOR_ADDRESS
        sync: false
      - key: OPERATOR_COUNTRY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
